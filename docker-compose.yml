services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_management}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Reuse the same application settings as a manual backend run. The root
    # file remains Docker-friendly, while backend/.env can supply local OAuth
    # and SMTP secrets without committing either file to Git.
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      # Docker always uses PostgreSQL even when backend/.env uses SQLite for a
      # manual uvicorn run. Other application settings come from env_file.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meeting_user:meeting_password@db:5432/meeting_management}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://frontend:80
    profiles: ["iphone"]
    restart: unless-stopped
    depends_on:
      - frontend

volumes:
  postgres_data:
