services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_management}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meeting_user:meeting_password@db:5432/meeting_management}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-leader@example.com}
      LEADER_EMAIL: ${LEADER_EMAIL:-leader@example.com}
      EMPLOYEE_ONE_EMAIL: ${EMPLOYEE_ONE_EMAIL:-employee.one@example.com}
      EMPLOYEE_TWO_EMAIL: ${EMPLOYEE_TWO_EMAIL:-employee.two@example.com}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      REMINDER_MAX_ATTEMPTS: ${REMINDER_MAX_ATTEMPTS:-3}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/google/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_STATE_SECRET: ${GOOGLE_OAUTH_STATE_SECRET:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      SPRINT3_SEED_ACCOUNTS: ${SPRINT3_SEED_ACCOUNTS:-true}
      SPRINT3_CREDENTIALS_FILE: ${SPRINT3_CREDENTIALS_FILE:-sprint3_credentials.local.csv}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CURRENT_USER_EMAIL: ${VITE_CURRENT_USER_EMAIL:-leader@example.com}
        VITE_EMPLOYEE_ONE_EMAIL: ${VITE_EMPLOYEE_ONE_EMAIL:-employee.one@example.com}
        VITE_EMPLOYEE_TWO_EMAIL: ${VITE_EMPLOYEE_TWO_EMAIL:-employee.two@example.com}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
